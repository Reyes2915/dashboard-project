# Hardened nginx server for the FinOps Enterprise SPA (OWASP Web A02 Security Misconfiguration).
# Runs inside nginxinc/nginx-unprivileged (non-root, port 8080). Installed as /etc/nginx/conf.d/default.conf.

# Rate limiting at the edge (defence in depth for OWASP API4).
limit_req_zone $binary_remote_addr zone=spa_limit:10m rate=20r/s;

map $sent_http_content_type $static_cache_control {
    default                    "no-store";
    ~*text/html                "no-store, max-age=0";
    ~*application/javascript   "public, max-age=31536000, immutable";
    ~*text/css                 "public, max-age=31536000, immutable";
    ~*image/                   "public, max-age=604800";
    ~*font/                    "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    limit_req zone=spa_limit burst=40 nodelay;
    limit_req_status 429;

    # Compression.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/csv;

    # Only the methods a static SPA needs.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Never serve dotfiles, source maps or backup files.
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~* \.(map|bak|orig|swp)$ {
        deny all;
        return 404;
    }

    # Hashed, immutable build assets.
    location ~* \.(?:js|css|woff2?|ico|png|svg|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $static_cache_control always;
        try_files $uri =404;
    }

    # SPA fallback. index.html is never cached and receives a per-request CSP nonce
    # that Angular (ngCspNonce) applies to the <style> elements it creates at runtime.
    location / {
        sub_filter_once off;
        sub_filter '__CSP_NONCE__' $request_id;

        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }
}
